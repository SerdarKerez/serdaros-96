<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" shape-rendering="crispEdges">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#244b37" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#244b37"/>
      <stop offset="1" stop-color="#163e2e"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#1d3324"/>
  <!-- CRT frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="#0f2419" stroke="#9fbf7f" stroke-width="4"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="url(#glow)"/>
  <rect x="54" y="54" width="1092" height="522" rx="18" fill="url(#grid)" opacity="0.6"/>

  <!-- title bar -->
  <rect x="54" y="54" width="1092" height="40" fill="#9fbf7f"/>
  <text x="76" y="83" font-family="VT323, monospace" font-size="28" fill="#163e2e">C:\SERDAROS\BLOG\VERI_MUH.EXE</text>
  <rect x="1060" y="62" width="24" height="24" fill="#eef0d6" stroke="#163e2e" stroke-width="2"/>
  <rect x="1094" y="62" width="24" height="24" fill="#b5523b" stroke="#163e2e" stroke-width="2"/>

  <!-- headline -->
  <text x="90" y="178" font-family="VT323, monospace" font-size="78" fill="#fffce9">VERİ MÜHENDİSLİĞİ</text>
  <text x="90" y="250" font-family="VT323, monospace" font-size="78" fill="#8ccf88">+ YAPAY ZEKA</text>
  <text x="92" y="300" font-family="Tahoma, Verdana, sans-serif" font-size="24" fill="#eef0d6">Model, boru hattı kadar iyidir.</text>

  <!-- pipeline: sources -->
  <g font-family="Tahoma, Verdana, sans-serif" font-size="16" fill="#163e2e">
    <rect x="90" y="370" width="110" height="44" fill="#eef0d6"/><text x="145" y="398" text-anchor="middle">API</text>
    <rect x="90" y="426" width="110" height="44" fill="#eef0d6"/><text x="145" y="454" text-anchor="middle">DB</text>
    <rect x="90" y="482" width="110" height="44" fill="#eef0d6"/><text x="145" y="510" text-anchor="middle">LOG</text>
  </g>
  <!-- pipe -->
  <rect x="200" y="440" width="560" height="16" fill="#244b37" stroke="#9fbf7f" stroke-width="3"/>
  <rect x="200" y="384" width="30" height="16" fill="#9fbf7f"/><rect x="222" y="384" width="16" height="72" fill="#9fbf7f"/>
  <rect x="200" y="496" width="30" height="16" fill="#9fbf7f"/><rect x="222" y="440" width="16" height="72" fill="#9fbf7f"/>
  <!-- data blocks in pipe -->
  <g>
    <rect x="270" y="442" width="12" height="12" fill="#b5523b"/>
    <rect x="320" y="442" width="12" height="12" fill="#c9a45c"/>
    <rect x="370" y="442" width="12" height="12" fill="#b5523b"/>
    <rect x="430" y="442" width="12" height="12" fill="#8ccf88"/>
    <rect x="500" y="442" width="12" height="12" fill="#8ccf88"/>
    <rect x="570" y="442" width="12" height="12" fill="#8ccf88"/>
    <rect x="640" y="442" width="12" height="12" fill="#8ccf88"/>
    <rect x="700" y="442" width="12" height="12" fill="#8ccf88"/>
  </g>
  <!-- filter box -->
  <rect x="390" y="410" width="80" height="76" fill="#163e2e" stroke="#c9a45c" stroke-width="4"/>
  <text x="430" y="456" text-anchor="middle" font-family="VT323, monospace" font-size="26" fill="#c9a45c">QA</text>
  <text x="430" y="510" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif" font-size="14" fill="#eef0d6">doğrulama</text>

  <!-- AI chip -->
  <g transform="translate(780 340)">
    <g fill="#9fbf7f">
      <rect x="30" y="-16" width="8" height="16"/><rect x="62" y="-16" width="8" height="16"/><rect x="94" y="-16" width="8" height="16"/><rect x="126" y="-16" width="8" height="16"/>
      <rect x="30" y="196" width="8" height="16"/><rect x="62" y="196" width="8" height="16"/><rect x="94" y="196" width="8" height="16"/><rect x="126" y="196" width="8" height="16"/>
      <rect x="164" y="40" width="16" height="8"/><rect x="164" y="80" width="16" height="8"/><rect x="164" y="120" width="16" height="8"/><rect x="164" y="160" width="16" height="8"/>
    </g>
    <rect x="0" y="0" width="164" height="196" fill="#1d3324" stroke="#8ccf88" stroke-width="5"/>
    <rect x="22" y="22" width="120" height="152" fill="#244b37" stroke="#c9a45c" stroke-width="3"/>
    <text x="82" y="112" text-anchor="middle" font-family="VT323, monospace" font-size="64" fill="#fffce9">AI</text>
    <text x="82" y="148" text-anchor="middle" font-family="Tahoma, Verdana, sans-serif" font-size="14" fill="#9fbf7f">model</text>
  </g>

  <!-- right column outputs -->
  <g font-family="VT323, monospace" font-size="24" fill="#eef0d6">
    <text x="990" y="380">&gt; RAG</text>
    <text x="990" y="420">&gt; BI</text>
    <text x="990" y="460">&gt; ML</text>
    <text x="990" y="500">&gt;</text>
  </g>
  <rect x="1010" y="484" width="12" height="20" fill="#8ccf88"/>

  <!-- footer -->
  <text x="90" y="560" font-family="VT323, monospace" font-size="24" fill="#9fbf7f">GARBAGE IN = GARBAGE OUT</text>
  <text x="1110" y="560" text-anchor="end" font-family="VT323, monospace" font-size="24" fill="#c9a45c">SerdarOS 96</text>

  <rect x="54" y="54" width="1092" height="522" rx="18" fill="url(#scan)"/>
</svg>
